# Linux FULL (ready-to-play) build for Bloody Roar II Recompiled.
#
# Unlike the "setup-host" build (which ships only the launcher + Generate &
# rebuild wizard), this workflow produces the complete, self-contained game
# binary with the recompiled game code compiled in - the Linux equivalent of the
# Windows zip: download -> pick your disc -> play. No toolchain needed on the
# player side.
#
# The single universal executable links the EU, USA and Japan/Asia images (each
# emitted under its own symbol prefix) and selects one from the mounted disc's
# SYSTEM.CNF at boot.
#
# The recompiled game C (generated/SLES_017.22_*.c + SCUS_944.24_*.c +
# SLPS_018.42_*.c) is derived from the game's copyrighted disc, so it is NEVER
# committed to this public repo. It is injected at build time from a PRIVATE
# repository via a secret PAT (see the README / Actions setup notes). The
# OpenBIOS backend is open-source (MIT) and ships inside the psxrecomp submodule.
#
# Manual trigger only (heavy build; requires the generated-repo secret).

name: Linux full build (ready-to-play)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the artifacts (e.g. 0.7.1). Empty = use VERSION file.'
        required: false
        type: string
        default: ''

concurrency:
  group: linux-full-build-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build:
    name: linux-x64 ready-to-play
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (submodules are the framework pin)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.version }}"
          if [[ -z "${RAW}" ]]; then
            RAW="$(tr -d '[:space:]' <VERSION)"
          fi
          VER="${RAW#v}"
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]*)?$ ]]; then
            echo "::error::invalid version '${RAW}' (want X.Y.Z or vX.Y.Z)"
            exit 1
          fi
          printf '%s\n' "${VER}" >VERSION
          echo "version=${VER}" >>"$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${VER}" >>"$GITHUB_ENV"
          echo "Using version ${VER}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libgl1-mesa-dev libxtst-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev zip unzip \
            libvulkan-dev glslc ccache

      - name: Cache SDL3 source
        uses: actions/cache@v4
        with:
          path: .cache/sdl3-src
          key: sdl3-3.4.10-src

      - name: Prefetch SDL3 source
        shell: bash
        run: |
          set -euo pipefail
          OUT=".cache/sdl3-src"
          if [[ -f "${OUT}/CMakeLists.txt" ]]; then
            echo "SDL3 source cache hit"
          else
            bash psxrecomp/tools/ci/prefetch_sdl3.sh --out-dir "${OUT}"
          fi
          echo "PSX_SDL3_SOURCE_DIR=${GITHUB_WORKSPACE}/${OUT}" >>"$GITHUB_ENV"

      - name: Restore game generated C from private repo
        shell: bash
        env:
          GENERATED_REPO: ${{ secrets.GENERATED_REPO }}
          GENERATED_REPO_PAT: ${{ secrets.GENERATED_REPO_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${GENERATED_REPO:-}" || -z "${GENERATED_REPO_PAT:-}" ]]; then
            echo "::error::secrets GENERATED_REPO / GENERATED_REPO_PAT are not set." >&2
            echo "::error::Create a private repo with the game generated C and add a PAT secret." >&2
            exit 1
          fi
          rm -rf generated
          git clone --depth 1 \
            "https://x-access-token:${GENERATED_REPO_PAT}@github.com/${GENERATED_REPO}.git" \
            generated
          rm -rf generated/.git
          echo "restored game generated C:"
          ls generated | sed -n '1,6p'

      - name: Verify game generated C present (EU + USA + Japan)
        shell: bash
        run: |
          set -euo pipefail
          for S in SLES_017.22 SCUS_944.24 SLPS_018.42; do
            test -f "generated/${S}_dispatch.c" || { echo "::error::missing ${S}_dispatch.c"; exit 1; }
            test -f "generated/${S}_decls.h" || { echo "::error::missing ${S}_decls.h"; exit 1; }
            N="$(find generated -maxdepth 1 -type f -name "${S}_full_*.c" | wc -l)"
            test "${N}" -gt 0 || { echo "::error::no ${S} generated C translation units"; exit 1; }
            echo "${S}: ${N} translation units"
          done
          echo "universal build: all three region generated C sets present"

      - name: Run synthetic release regression guards
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test_mod_netplay_plan_wiring.py \
            test_mod_native_vblank_rate_survives_pal.py \
            test_bios_selection_guards.py \
            test_recomp_ui_root_override.py \
            test_launcher_pad_mode_wiring.py \
            test_launcher_vulkan_option.py \
            test_mod_catalog_layout.py \
            test_default_renderer_guards.py \
            test_vk_build_default.py; do
            python3 "psxrecomp/runtime/tests/${test}"
          done

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-full-${{ steps.version.outputs.version }}
          max-size: 1200M

      - name: Build BIOS recompiler (emitter)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S psxrecomp/recompiler -B psxrecomp/recompiler/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build psxrecomp/recompiler/build --target psxrecomp-bios -j"$(nproc)"

      - name: Regenerate OpenBIOS backend (MIT, no BIOS dump needed)
        shell: bash
        run: |
          set -euo pipefail
          (cd psxrecomp && bash tools/regen_bios.sh --config bios/OpenBIOS.toml)
          ls -1 psxrecomp/generated/OpenBIOS_* | head
          test -f psxrecomp/generated/OpenBIOS_full.c || { echo "::error::OpenBIOS_full.c not generated"; exit 1; }
          test -f psxrecomp/generated/OpenBIOS_dispatch.c || { echo "::error::OpenBIOS_dispatch.c not generated"; exit 1; }
          echo "OpenBIOS backend regenerated"

      - name: Configure universal game build
        shell: bash
        env:
          VULKAN_SDK: /usr
        run: |
          set -euo pipefail
          EXTRA=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          if command -v glslc >/dev/null 2>&1; then
            EXTRA+=("-DGLSLC_EXE=$(command -v glslc)")
          fi
          EXTRA+=("-DFETCHCONTENT_SOURCE_DIR_SDL3=${PSX_SDL3_SOURCE_DIR}")
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPSX_SETUP_WIZARD=ON \
            -DPSX_GAME_VERSION="${RELEASE_VERSION}" \
            -DBR2_BUILD_UNIVERSAL=ON \
            "${EXTRA[@]}" 2>&1 | tee build-ci-configure.log
          if ! grep -q 'Vulkan backend: headers' build-ci-configure.log; then
            echo "::error::CMake did not enable PSX_HAVE_VULKAN (see configure log)"
            exit 1
          fi

      - name: Build universal binary
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-ci --target psx-runtime-universal -j"$(nproc)"

      - name: Verify binary and version pin
        shell: bash
        run: |
          set -euo pipefail
          test -x build-ci/BloodyRoar2_Recompiled || { echo "::error::universal binary missing"; exit 1; }
          file build-ci/BloodyRoar2_Recompiled
          file build-ci/BloodyRoar2_Recompiled | grep -q 'ELF 64-bit.*x86-64' || {
            echo "::error::binary is not a Linux x86-64 ELF executable"; exit 1;
          }
          if ldd build-ci/BloodyRoar2_Recompiled | grep -q 'not found'; then
            echo "::error::binary has unresolved shared-library dependencies"; exit 1;
          fi
          FOUND_STAMP=0
          for d in build-ci build-ci/Release; do
            if [[ -f "${d}/psx_game_version.txt" ]]; then
              FOUND_STAMP=1
              BUILT="$(tr -d '[:space:]' <"${d}/psx_game_version.txt")"
              BUILT="${BUILT#v}"
              if [[ "${BUILT}" != "${RELEASE_VERSION}" ]]; then
                echo "::error::version pin ${BUILT} != ${RELEASE_VERSION}"
                exit 1
              fi
              echo "version pin ok: ${BUILT} (${d})"
            fi
          done
          if [[ "${FOUND_STAMP}" -ne 1 ]]; then
            echo "::error::missing psx_game_version.txt after universal build"
            exit 1
          fi

      - name: Package Linux release zip (ready-to-play)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package_release_linux.sh
          scripts/package_release_linux.sh build-ci "${RELEASE_VERSION}"
          ls -la dist/

      - name: Verify Linux release package contents
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls dist/BloodyRoar2-linux-x64-*.zip)"
          test -f "${ZIP}" || { echo "::error::missing package ${ZIP}"; exit 1; }
          CONTENTS="$(mktemp)"
          unzip -Z1 "${ZIP}" >"${CONTENTS}"
          grep -qE '(^|/)BloodyRoar2/BloodyRoar2_Recompiled$' "${CONTENTS}"
          grep -qE '(^|/)BloodyRoar2/game\.toml$' "${CONTENTS}"
          grep -qE '(^|/)BloodyRoar2/bios/openbios\.bin$' "${CONTENTS}"
          grep -qE '(^|/)BloodyRoar2/assets/psxrecomp\.png$' "${CONTENTS}"
          grep -qE '(^|/)BloodyRoar2/mods/bundled/br2\.enhancement\.widescreen/1\.0\.0/manifest\.toml$' "${CONTENTS}"
          if grep -qiE '(^|/)(generated/.*\.c|.*\.(cue|iso|chd|ecm|mcd|sbi))$' "${CONTENTS}"; then
            echo "::error::release ZIP includes generated game C, disc data or memory card" >&2
            grep -iE '(^|/)(generated/.*\.c|.*\.(cue|iso|chd|ecm|mcd|sbi))$' "${CONTENTS}" >&2
            exit 1
          fi
          rm -f "${CONTENTS}"
          echo "verified package contents: ${ZIP}"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: br2-linux-ready-to-play
          path: dist/BloodyRoar2-linux-x64-*.zip
          if-no-files-found: error
          retention-days: 30
